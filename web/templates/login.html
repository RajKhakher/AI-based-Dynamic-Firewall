<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firewall · Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <form class="login-card" method="post" autocomplete="off">
    <div class="brand">
      <span class="brand-mark">▮▮</span>
      <h1>Dynamic Firewall</h1>
      <p class="muted">AI-assisted network protection</p>
    </div>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <label>Username
      <input name="username" required autofocus value="admin">
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <button type="submit" class="btn primary block">Sign in</button>
    <p class="muted small">First run? Default login is <b>admin</b> / <b>admin</b> — you'll be asked to change it.</p>
  </form>
</body>
</html>
